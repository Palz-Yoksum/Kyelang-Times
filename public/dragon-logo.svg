<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Filter for subtle crispness -->
    <filter id="crisp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-opacity="0.1"/>
    </filter>

    <!-- Path for arched bottom text: THE TRADITIONAL TOUCH -->
    <!-- Arc from left to right along lower perimeter -->
    <path id="bottom-text-arc" d="M 105 320 A 185 185 0 0 0 395 320" fill="none" />

    <!-- Pattern for traditional Tibetan fretwork / meander border -->
    <pattern id="tibetan-fret" width="24" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 18 3 L 18 17 L 6 17 L 6 9 L 12 9 L 12 12 L 9 12 L 9 14 L 15 14 L 15 6 L 3 6 L 3 20" 
            fill="none" stroke="#93412f" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/>
      <line x1="21" y1="0" x2="21" y2="20" stroke="#93412f" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!-- Clean White Circular Emblem Canvas -->
  <circle cx="250" cy="250" r="246" fill="#ffffff" />

  <!-- Outer Concentric Rings -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#686b6e" stroke-width="2.5" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#2b2e30" stroke-width="5" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#a0a3a6" stroke-width="1.2" />

  <!-- Top Center: Hanging cord and Tibetan Auspicious Endless Knot (Shrivatsa) -->
  <g id="endless-knot" transform="translate(0, 0)">
    <!-- Thin hanging cord from top rim -->
    <line x1="250" y1="102" x2="250" y2="120" stroke="#d59b2b" stroke-width="1.8" />

    <!-- Endless Knot woven ribbon in terracotta red -->
    <g stroke="#93412f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <!-- Upper loops -->
      <path d="M 250 122 L 264 136 L 250 150 L 236 136 Z" />
      <path d="M 236 136 L 222 150 L 236 164 L 250 150" />
      <path d="M 264 136 L 278 150 L 264 164 L 250 150" />
      
      <!-- Central intertwined loops -->
      <path d="M 222 150 L 236 164 L 250 178 L 264 164 L 278 150" />
      <path d="M 236 164 L 250 150 L 264 164" />
      <path d="M 250 150 L 250 178" />

      <!-- Lower terminal loop and knot binding -->
      <path d="M 238 172 L 250 184 L 262 172" />
    </g>

    <!-- Golden Silk Tassel hanging down -->
    <!-- Tassel loop and gold bead cap -->
    <line x1="250" y1="184" x2="250" y2="191" stroke="#d59b2b" stroke-width="2.5" />
    <circle cx="250" cy="192" r="3.2" fill="#d59b2b" />
    <!-- Tassel body -->
    <rect x="248" y="194" width="4" height="24" rx="2" fill="#d59b2b" />
    <!-- Tassel fine silk fringes -->
    <line x1="247" y1="218" x2="246" y2="228" stroke="#d59b2b" stroke-width="1.2" />
    <line x1="249" y1="218" x2="249" y2="231" stroke="#b8831e" stroke-width="1.2" />
    <line x1="250" y1="218" x2="250" y2="233" stroke="#e6af3a" stroke-width="1.2" />
    <line x1="251" y1="218" x2="251" y2="231" stroke="#b8831e" stroke-width="1.2" />
    <line x1="253" y1="218" x2="254" y2="228" stroke="#d59b2b" stroke-width="1.2" />
  </g>

  <!-- Tibetan Calligraphy (Left: ཀྱེ་ལང [Kyelang], Right: ཏིམས [Times]) -->
  <!-- Authentic Tibetan Uchen Calligraphic Vector Path Rendering -->
  <g fill="#212427">
    <!-- Left: ཀྱེ་ (Kye) -->
    <g transform="translate(112, 138)">
      <!-- ཀ Ka base with horizontal top bar -->
      <rect x="0" y="5" width="34" height="4.5" rx="0.5"/>
      <!-- Vertical left drop -->
      <path d="M 6 9.5 L 6 36 Q 6 42 12 42 L 15 42 Q 18 42 18 36 L 18 9.5" fill="#212427"/>
      <!-- Center downward stem -->
      <rect x="18" y="9.5" width="4.5" height="38"/>
      <!-- Right curve loop -->
      <path d="M 22.5 9.5 Q 36 10 36 24 Q 36 34 26 35 L 22.5 35" fill="none" stroke="#212427" stroke-width="4.2"/>
      <!-- Subjoined Ya-tag (ྱ) swooping under -->
      <path d="M 20 47 Q 20 62 10 65 Q 2 67 0 63 Q 5 57 14 53 Q 18 50 18 47" fill="#212427"/>
      <!-- Top vowel sign Dreng-bu (ེ) -->
      <path d="M 12 5 Q 16 -8 24 -6 Q 28 -5 27 0 Q 25 5 18 5 Z" fill="#212427"/>
      <!-- Tsheg dot (་) -->
      <polygon points="38,-2 44,-2 41,5" fill="#212427"/>
    </g>

    <!-- Left: ལང (Lang) -->
    <g transform="translate(162, 142)">
      <!-- ལ La glyph -->
      <rect x="0" y="2" width="28" height="4.2"/>
      <path d="M 5 6 L 5 36 Q 5 44 14 44 Q 24 44 24 35 L 24 6" fill="none" stroke="#212427" stroke-width="4.2"/>
      <rect x="12" y="6" width="4" height="34"/>
      <!-- ང Nga glyph -->
      <g transform="translate(32, 2)">
        <rect x="0" y="0" width="22" height="4"/>
        <rect x="9" y="4" width="4" height="36"/>
        <path d="M 13 18 Q 26 18 26 28 Q 26 38 15 38" fill="none" stroke="#212427" stroke-width="4"/>
      </g>
    </g>

    <!-- Right: ཏིམས (Times) -->
    <g transform="translate(315, 140)">
      <!-- ཏ Ta glyph with top Gi-gu vowel (ི) -->
      <rect x="0" y="5" width="26" height="4.5"/>
      <rect x="11" y="9.5" width="4.5" height="36"/>
      <path d="M 15 16 Q 28 17 28 29 Q 28 42 16 42" fill="none" stroke="#212427" stroke-width="4.2"/>
      <!-- Gi-gu curve (ི) on top -->
      <path d="M 6 5 Q 13 -7 20 5 Q 15 -2 8 5" fill="#212427"/>

      <!-- མ Ma glyph -->
      <g transform="translate(32, 2)">
        <rect x="0" y="3" width="22" height="4"/>
        <rect x="4" y="7" width="4" height="36"/>
        <rect x="18" y="7" width="4" height="36"/>
        <path d="M 4 24 L 22 24" stroke="#212427" stroke-width="4"/>
        <path d="M 4 41 Q 12 45 22 41" stroke="#212427" stroke-width="4" fill="none"/>
      </g>

      <!-- ས Sa glyph -->
      <g transform="translate(60, 4)">
        <rect x="0" y="1" width="22" height="4"/>
        <rect x="3" y="5" width="4" height="36"/>
        <path d="M 7 16 Q 22 16 22 28 Q 22 39 10 39" fill="none" stroke="#212427" stroke-width="4"/>
        <path d="M 14 39 Q 20 44 26 42" stroke="#212427" stroke-width="3" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Middle Banner: Upper Traditional Tibetan Fretwork Ribbon -->
  <g id="upper-ribbon">
    <!-- Top & Bottom Frame Lines in Terracotta Red -->
    <line x1="90" y1="237" x2="410" y2="237" stroke="#93412f" stroke-width="2.2" />
    <line x1="90" y1="258" x2="410" y2="258" stroke="#93412f" stroke-width="2.2" />
    <!-- Repeating Geometric Key Fret Pattern -->
    <rect x="90" y="238.5" width="320" height="18.5" fill="url(#tibetan-fret)" />
  </g>

  <!-- Main Headline: KYELANG TIMES (Bold, Vintage High-Contrast Serif Typography) -->
  <g id="headline" fill="#24282c">
    <text x="250" y="297" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="40" 
          font-weight="800" 
          letter-spacing="3" 
          text-anchor="middle"
          filter="url(#crisp)">
      KYELANG TIMES
    </text>
  </g>

  <!-- Middle Banner: Lower Traditional Tibetan Fretwork Ribbon -->
  <g id="lower-ribbon">
    <!-- Top & Bottom Frame Lines in Terracotta Red -->
    <line x1="90" y1="305" x2="410" y2="305" stroke="#93412f" stroke-width="2.2" />
    <line x1="90" y1="326" x2="410" y2="326" stroke="#93412f" stroke-width="2.2" />
    <!-- Repeating Geometric Key Fret Pattern -->
    <rect x="90" y="306.5" width="320" height="18.5" fill="url(#tibetan-fret)" />
  </g>

  <!-- Bottom Arched Subtitle: THE TRADITIONAL TOUCH -->
  <!-- Perfectly follows the bottom curve inside the circular border -->
  <g id="bottom-arc-text" fill="#24282c">
    <text font-family="'Plus Jakarta Sans', 'Cinzel', 'Helvetica Neue', sans-serif" 
          font-size="16.5" 
          font-weight="700" 
          letter-spacing="5.5" 
          text-anchor="middle">
      <textPath href="#bottom-text-arc" startOffset="50%" text-anchor="middle">
        THE TRADITIONAL TOUCH
      </textPath>
    </text>
  </g>
</svg>
